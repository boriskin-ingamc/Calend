<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendrier Heineken — Semaines 2026</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --green-dark: #004d27;
    --green: #00843d;
    --green-light: #18a957;

    --green-soft: #eaf5ed;

    --red: #e3262e;

    --gold: #d7b44a;
    --gold-light: #f0d477;

    --text: #123524;
    --muted: #87958d;

    --week-bg: #edf5ef;
    --week-border: #c8ddd0;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(0,132,61,.20),
            transparent 30%
        ),
        #082d1c;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);
}


/* =========================================================
   BARRE DE CONTRÔLE
========================================================= */

.controls {

    display: flex;
    gap: 10px;

    margin: 20px 0;

    justify-content: center;
}

.controls button {

    border: none;

    padding: 11px 18px;

    border-radius: 999px;

    background: white;

    color: var(--green-dark);

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.20);

    transition:
        transform .2s,
        box-shadow .2s;
}

.controls button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.28);
}


/* =========================================================
   FORMAT FINAL
   15 CM × 15 CM MAXIMUM
========================================================= */

#calendar {

    width: 15cm;
    height: 15cm;

    position: relative;

    overflow: hidden;

    padding: 0.42cm;

    border-radius: 0.28cm;

    background:

        radial-gradient(
            ellipse at 15% 15%,
            rgba(255,255,255,.12),
            transparent 25%
        ),

        radial-gradient(
            ellipse at 85% 90%,
            rgba(255,255,255,.10),
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #004d27,
            #007b39 48%,
            #005c2d
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

}


/* =========================================================
   TEXTURE
========================================================= */

#calendar::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .07;

    background-image:

        radial-gradient(
            rgba(255,255,255,.8) .7px,
            transparent .7px
        );

    background-size: 7px 7px;

    pointer-events: none;
}


/* =========================================================
   CADRE INTERNE
========================================================= */

.inner-frame {

    position: absolute;

    inset: 0.22cm;

    border:
        1px solid rgba(255,255,255,.28);

    border-radius: 0.20cm;

    pointer-events: none;

}


/* =========================================================
   EN-TÊTE
========================================================= */

.header {

    position: relative;

    z-index: 10;

    height: 1.42cm;

    display: grid;

    grid-template-columns:
        2.4cm
        1fr
        2.4cm;

    align-items: center;

    gap: .12cm;
}


/* =========================================================
   LOGO HEINEKEN
========================================================= */

.heineken-logo {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: white;

    line-height: 1;
}


/* étoile */

.star {

    position: relative;

    width: .48cm;
    height: .48cm;

    margin-bottom: .03cm;

    color: white;

    font-size: .40cm;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* nom */

.brand {

    font-family:
        Arial Black,
        Arial,
        sans-serif;

    font-size: .31cm;

    font-weight: 900;

    letter-spacing: .025cm;
}


/* =========================================================
   TITRE
========================================================= */

.title {

    text-align: center;

    color: white;
}

.title .year {

    font-family:
        Arial Black,
        "Segoe UI",
        sans-serif;

    font-size: .78cm;

    line-height: .8;

    letter-spacing: -.04cm;

    font-weight: 950;
}

.title .subtitle {

    margin-top: .10cm;

    font-size: .19cm;

    font-weight: 700;

    letter-spacing: .035cm;

    text-transform: uppercase;

    opacity: .88;
}

.title .gold-line {

    width: 1.25cm;

    height: .035cm;

    margin: .08cm auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold-light),
            transparent
        );
}


/* =========================================================
   BADGE S1 → S53
========================================================= */

.year-badge {

    justify-self: end;

    width: 2.05cm;

    padding: .12cm .08cm;

    border-radius: .13cm;

    border:
        1px solid rgba(255,255,255,.28);

    background:
        rgba(0,0,0,.12);

    text-align: center;

    color: white;
}

.year-badge strong {

    display: block;

    font-size: .27cm;

    font-weight: 900;
}

.year-badge small {

    display: block;

    margin-top: .035cm;

    font-size: .13cm;

    line-height: 1.25;

    opacity: .82;
}


/* =========================================================
   DÉCORATIONS — ORGE
========================================================= */

.barley {

    position: absolute;

    width: 1.9cm;
    height: 4.3cm;

    opacity: .20;

    pointer-events: none;

    z-index: 1;
}

.barley.left {

    left: -.25cm;
    bottom: -.25cm;

    transform: rotate(-18deg);
}

.barley.right {

    right: -.28cm;
    top: 1.5cm;

    transform: rotate(17deg);
}


/* tige */

.barley-stem {

    position: absolute;

    width: .065cm;
    height: 3.7cm;

    left: .95cm;
    top: .30cm;

    border-radius: 999px;

    background:
        linear-gradient(
            180deg,
            #f0d477,
            #b99532
        );
}


/* grains */

.barley-grain {

    position: absolute;

    width: .30cm;
    height: .14cm;

    border-radius:
        100% 20% 100% 20%;

    background:
        linear-gradient(
            135deg,
            #f1d77a,
            #bd9a35
        );
}

.g01 { left:.68cm; top:.50cm; transform:rotate(-28deg); }
.g02 { left:1.05cm; top:.65cm; transform:rotate(28deg); }
.g03 { left:.62cm; top:.88cm; transform:rotate(-28deg); }
.g04 { left:1.10cm; top:1.03cm; transform:rotate(28deg); }
.g05 { left:.56cm; top:1.26cm; transform:rotate(-28deg); }
.g06 { left:1.13cm; top:1.42cm; transform:rotate(28deg); }
.g07 { left:.51cm; top:1.65cm; transform:rotate(-28deg); }
.g08 { left:1.15cm; top:1.82cm; transform:rotate(28deg); }
.g09 { left:.47cm; top:2.04cm; transform:rotate(-28deg); }
.g10 { left:1.17cm; top:2.20cm; transform:rotate(28deg); }
.g11 { left:.45cm; top:2.43cm; transform:rotate(-28deg); }
.g12 { left:1.16cm; top:2.60cm; transform:rotate(28deg); }
.g13 { left:.48cm; top:2.82cm; transform:rotate(-28deg); }
.g14 { left:1.12cm; top:3.00cm; transform:rotate(28deg); }


/* =========================================================
   HOUBLON
========================================================= */

.hops {

    position: absolute;

    width: 1.8cm;
    height: 1.8cm;

    opacity: .12;

    z-index: 1;
}

.hops.top-right {

    right: .35cm;
    top: .20cm;
}

.hops.bottom-left {

    left: .20cm;
    bottom: .10cm;
}

.hop {

    position: absolute;

    width: .55cm;
    height: .55cm;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #d4ed70,
            #76aa32 75%
        );

    box-shadow:
        .12cm .06cm 0 -.025cm #65992c,
        -.10cm .12cm 0 -.03cm #82b73a;
}

.hop:nth-child(1) {
    left:.55cm;
    top:.25cm;
}

.hop:nth-child(2) {
    left:.25cm;
    top:.80cm;
}

.hop:nth-child(3) {
    left:.88cm;
    top:.88cm;
}


/* =========================================================
   CONTENEUR DES 12 MOIS
========================================================= */

.months {

    position: relative;

    z-index: 5;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(4, 1fr);

    gap: .13cm;

    height: calc(
        15cm - 2.30cm
    );
}


/* =========================================================
   CARTE MOIS
========================================================= */

.month {

    min-width: 0;

    min-height: 0;

    padding: .10cm;

    border-radius: .11cm;

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 .035cm .12cm rgba(0,0,0,.18);

    overflow: hidden;
}


/* =========================================================
   TITRE DU MOIS
========================================================= */

.month-title {

    height: .31cm;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 .05cm;

    color: var(--green-dark);

    font-weight: 950;

    font-size: .22cm;

    text-transform: uppercase;

    letter-spacing: .015cm;
}

.month-title .month-name {

    font-weight: 950;
}

.month-title .month-year {

    font-size: .13cm;

    color: #91a097;

    font-weight: 800;
}


/* =========================================================
   EN-TÊTE SEMAINE + JOURS
========================================================= */

.calendar-head {

    display: grid;

    /*
       première colonne = semaine
       puis 7 jours
    */

    grid-template-columns:
        .37cm repeat(7, 1fr);

    align-items: center;

    height: .27cm;

    border-bottom:
        .018cm solid #d9e6dd;
}


/* cellule SEM */

.week-head {

    font-size: .10cm;

    font-weight: 950;

    text-align: center;

    color: var(--green);

    letter-spacing: -.01cm;
}


/* jours */

.day-head {

    text-align: center;

    font-size: .115cm;

    font-weight: 950;

    color: #53665b;
}


/* =========================================================
   LIGNES DU CALENDRIER
========================================================= */

.calendar-grid {

    display: grid;

    grid-template-columns:
        .37cm repeat(7, 1fr);

    grid-template-rows:
        repeat(6, 1fr);

    height: calc(
        100% - .58cm
    );
}


/* =========================================================
   NUMÉRO SEMAINE
========================================================= */

.week-number {

    display: flex;

    align-items: center;

    justify-content: center;

    margin: .018cm;

    border-radius: .035cm;

    background:
        var(--week-bg);

    color:
        var(--green-dark);

    font-size: .105cm;

    font-weight: 950;

    border-right:
        .012cm solid var(--week-border);
}


/* =========================================================
   CELLULE JOUR
========================================================= */

.day-cell {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: .018cm;

    border-radius: .035cm;

    font-size: .145cm;

    font-weight: 750;

    color: #172a20;

    background: #fff;

    transition:
        background .15s;
}


/* lignes */

.day-cell:not(:nth-child(8n)) {

    border-right:
        .008cm solid #edf1ee;
}


/* week-end */

.day-cell.weekend {

    color: #67736d;

    background:
        #f7f9f7;
}


/* hors mois */

.day-cell.other-month {

    color: #b7c0bb;

    background:
        #fafbfa;

    font-weight: 600;
}


/* dimanche */

.day-cell.sunday {

    color: #a56b65;
}


/* =========================================================
   INDICATEUR AUJOURD'HUI
========================================================= */

.day-cell.today {

    color: white;

    background:
        var(--green);

    font-weight: 950;

    box-shadow:
        inset 0 0 0 .02cm rgba(255,255,255,.3);
}


/* =========================================================
   SEMAINE ACTIVE
========================================================= */

.day-cell.current-week {

    box-shadow:
        inset 0 -.025cm 0 var(--gold);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    position: absolute;

    z-index: 10;

    left: .45cm;
    right: .45cm;

    bottom: .17cm;

    height: .25cm;

    display: flex;

    align-items: center;

    justify-content: space-between;

    color: rgba(255,255,255,.78);

    font-size: .105cm;

    font-weight: 700;

    letter-spacing: .01cm;
}

.footer strong {

    color: white;
}


/* =========================================================
   IMPRESSION
========================================================= */

@media print {

    body {

        background: white;

    }

    .controls {

        display: none !important;

    }

    #calendar {

        box-shadow: none;

        margin: 0;

    }

}


/* =========================================================
   PETITS ÉCRANS
========================================================= */

@media(max-width:700px) {

    #calendar {

        width: 95vw;
        height: 95vw;

        padding: 2.7vw;

        border-radius: 2vw;
    }

    .header {

        height: 10vw;

        grid-template-columns:
            17% 1fr 17%;
    }

    .months {

        height: calc(95vw - 15vw);

        gap: 1vw;
    }

    .month {

        padding: .7vw;

    }

}

</style>

<script>

/* =========================================================
   PARAMÈTRES
========================================================= */

const YEAR = 2026;


/* =========================================================
   MOIS
========================================================= */

const MONTHS = [

    "Janvier",
    "Février",
    "Mars",
    "Avril",
    "Mai",
    "Juin",
    "Juillet",
    "Août",
    "Septembre",
    "Octobre",
    "Novembre",
    "Décembre"

];


const DAYS = [

    "Lu",
    "Ma",
    "Me",
    "Je",
    "Ve",
    "Sa",
    "Di"

];


/* =========================================================
   CALCUL SEMAINE ISO
========================================================= */

function getISOWeek(date) {

    const d = new Date(
        Date.UTC(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        )
    );

    const day =
        d.getUTCDay() || 7;

    d.setUTCDate(
        d.getUTCDate() +
        4 -
        day
    );

    const yearStart =
        new Date(
            Date.UTC(
                d.getUTCFullYear(),
                0,
                1
            )
        );

    return Math.ceil(
        (
            (
                d - yearStart
            ) / 86400000 + 1
        ) / 7
    );

}


/* =========================================================
   LUNDI D'UNE SEMAINE ISO
========================================================= */

function getISOWeekMonday(
    week,
    year
) {

    const date =
        new Date(
            Date.UTC(
                year,
                0,
                4
            )
        );

    const day =
        date.getUTCDay() || 7;

    date.setUTCDate(
        date.getUTCDate() -
        day +
        1 +
        (week - 1) * 7
    );

    return date;

}


/* =========================================================
   DATE LOCALE POUR COMPARAISON
========================================================= */

function dateKey(date) {

    return [

        date.getUTCFullYear(),

        String(
            date.getUTCMonth() + 1
        ).padStart(2,"0"),

        String(
            date.getUTCDate()
        ).padStart(2,"0")

    ].join("-");

}


/* =========================================================
   CRÉATION DU CALENDRIER
========================================================= */

function createMonth(
    monthIndex
) {

    const month =
        document.createElement("section");

    month.className = "month";


    /* -----------------------------------------------------
       TITRE
    ----------------------------------------------------- */

    const title =
        document.createElement("div");

    title.className =
        "month-title";


    title.innerHTML = `

        <span class="month-name">
            ${MONTHS[monthIndex]}
        </span>

        <span class="month-year">
            ${YEAR}
        </span>

    `;

    month.appendChild(title);


    /* -----------------------------------------------------
       HEADER
    ----------------------------------------------------- */

    const head =
        document.createElement("div");

    head.className =
        "calendar-head";


    /* colonne semaine */

    const sem =
        document.createElement("div");

    sem.className =
        "week-head";

    sem.textContent =
        "SEM";

    head.appendChild(sem);


    /* jours */

    DAYS.forEach(day => {

        const element =
            document.createElement("div");

        element.className =
            "day-head";

        element.textContent =
            day;

        head.appendChild(element);

    });


    month.appendChild(head);


    /* -----------------------------------------------------
       GRILLE
    ----------------------------------------------------- */

    const grid =
        document.createElement("div");

    grid.className =
        "calendar-grid";


    /*
        Premier jour du mois.
        JavaScript :
        0 = dimanche
        1 = lundi
        ...
    */

    const first =
        new Date(
            Date.UTC(
                YEAR,
                monthIndex,
                1
            )
        );


    let mondayOffset =
        first.getUTCDay() - 1;


    if(mondayOffset < 0) {

        mondayOffset = 6;

    }


    /*
        42 cases :
        6 lignes × 7 jours
    */

    const start =
        new Date(first);

    start.setUTCDate(
        first.getUTCDate() -
        mondayOffset
    );


    /* -----------------------------------------------------
       6 SEMAINES
    ----------------------------------------------------- */

    for(let week = 0; week < 6; week++) {


        /* date du lundi */

        const monday =
            new Date(start);

        monday.setUTCDate(
            start.getUTCDate() +
            week * 7
        );


        /*
            NUMÉRO ISO DE SEMAINE

            C'est ici que chaque ligne
            reçoit son numéro Sxx.
        */

        const weekNumber =
            getISOWeek(monday);


        const weekElement =
            document.createElement("div");

        weekElement.className =
            "week-number";

        weekElement.textContent =
            `S${weekNumber}`;

        grid.appendChild(
            weekElement
        );


        /* -------------------------------------------------
           7 JOURS
        ------------------------------------------------- */

        for(let dayIndex = 0; dayIndex < 7; dayIndex++) {


            const date =
                new Date(monday);

            date.setUTCDate(
                monday.getUTCDate() +
                dayIndex
            );


            const cell =
                document.createElement("div");

            cell.className =
                "day-cell";


            /* date */

            cell.textContent =
                date.getUTCDate();


            /* week-end */

            if(dayIndex >= 5) {

                cell.classList.add(
                    "weekend"
                );

            }


            /* dimanche */

            if(dayIndex === 6) {

                cell.classList.add(
                    "sunday"
                );

            }


            /* hors mois */

            if(
                date.getUTCMonth() !==
                monthIndex
            ) {

                cell.classList.add(
                    "other-month"
                );

            }


            /*
                Semaine courante
                au moment de l'affichage.
            */

            if(
                getISOWeek(date) ===
                getISOWeek(new Date())
                &&
                date.getUTCFullYear() ===
                YEAR
            ) {

                cell.classList.add(
                    "current-week"
                );

            }


            grid.appendChild(cell);

        }

    }


    month.appendChild(grid);

    return month;

}


/* =========================================================
   GÉNÉRATION DES 12 MOIS
========================================================= */

const monthsContainer =
    document.getElementById(
        "months"
    );


for(
    let month = 0;

/* =========================================================
   EXPORT PNG
========================================================= */

async function downloadPNG() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    const controls =
        document.querySelector(
            ".controls"
        );


    /* cacher les boutons */

    controls.style.display =
        "none";


    /*
        1800 × 1800 px.

        Le calendrier reste physiquement
        15 × 15 cm dans le navigateur /
        à l'impression, mais l'image
        exportée est beaucoup plus nette.
    */

    const canvas =
        await html2canvas(
            calendar,
            {

                width: 566.93,

                height: 566.93,

                scale: 3,

                backgroundColor:
                    "#005c2d",

                useCORS: true,

                logging: false,

                imageTimeout: 0

            }
        );


    const link =
        document.createElement("a");


    link.download =
        "Calendrier_Heineken_2026_S1-S53.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();


    /* réafficher */

    controls.style.display =
        "flex";

}

</script>
