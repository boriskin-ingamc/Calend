<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calendrier Semaines 2026</title>

https://html2canvas.hertzen.com/dist/html2canvas.min.jsscript>

<style>

body{
    margin:0;
    background:#0D6B36;
    display:flex;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
}

#calendar{
    width:1800px;
    height:1800px;
    background:#0D6B36;
    position:relative;
    padding:40px;
    box-sizing:border-box;
}

h1{
    text-align:center;
    color:white;
    font-size:72px;
    margin:0;
}

.logo{
    position:absolute;
    top:30px;
    left:40px;
    height:80px;
}

.grid{
    margin-top:40px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.week{
    background:white;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
}

.header{
    background:#1B8E4B;
    color:white;
    text-align:center;
    font-weight:bold;
    padding:6px;
}

.content{
    text-align:center;
    padding:10px;
}

.start{
    font-size:18px;
}

.end{
    font-size:18px;
    color:#666;
}

.barley{
    position:absolute;
    font-size:200px;
    opacity:.05;
    color:#FFD84D;
}

.b1{
    top:100px;
    right:50px;
}

.b2{
    bottom:100px;
    left:50px;
}

button{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:12px 20px;
}

</style>
</head>
<body>

<div id="calendar">

logo.png

<h1>2026</h1>

<div class="barley b1">🌾</div>
<div class="barley b2">🌾</div>

<div class="grid" id="weeks"></div>

</div>

<button onclick="exportPNG()">Exporter PNG</button>

<script>

function formatDate(d){
    return d.toLocaleDateString("fr-FR",{
        day:"2-digit",
        month:"2-digit"
    });
}

const container=document.getElementById("weeks");

let start=new Date("2025-12-29");

for(let i=1;i<=53;i++){

    let end=new Date(start);
    end.setDate(end.getDate()+6);

    container.innerHTML += `
        <div class="week">
            <div class="header">
                S${String(i).padStart(2,'0')}
            </div>

            <div class="content">
                <div class="start">${formatDate(start)}</div>
                <div>au</div>
                <div class="end">${formatDate(end)}</div>
            </div>
        </div>
    `;

    start.setDate(start.getDate()+7);
}

function exportPNG(){

    html2canvas(document.querySelector("#calendar"),{
        scale:2
    }).then(canvas=>{

        const a=document.createElement("a");
        a.href=canvas.toDataURL("image/png");
        a.download="Calendrier_Semaines_2026.png";
        a.click();

    });

}

</script>

</body>
</html>
