<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Semaines 2026</title>

https://html2canvas.hertzen.com/dist/html2canvas.min.jsscript>

<style>
body{
    margin:0;
    padding:20px;
    background:#0a5f2c;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#calendar{
    width:2048px;
    height:2048px;
    position:relative;
    background:
        radial-gradient(circle at 20% 15%, rgba(255,215,0,.15), transparent 25%),
        radial-gradient(circle at 80% 85%, rgba(255,215,0,.12), transparent 25%),
        linear-gradient(135deg,#0d6a34,#147a3f,#0d6a34);
    overflow:hidden;
    color:white;
}

.logo{
    position:absolute;
    top:25px;
    left:25px;
    width:180px;
    height:180px;
    object-fit:contain;
    background:white;
    border-radius:12px;
    padding:10px;
}

.title{
    text-align:center;
    font-size:60px;
    font-weight:bold;
    margin-top:30px;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    font-size:24px;
    opacity:0.9;
}

.grid{
    width:95%;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.week{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:8px;
    padding:8px;
    backdrop-filter:blur(2px);
}

.week-title{
    color:#ffd700;
    font-weight:bold;
    font-size:18px;
}

.week-date{
    font-size:15px;
}

/* Décors orge/malt */
.barley{
    position:absolute;
    opacity:0.15;
    color:#ffd700;
    font-size:180px;
    font-weight:bold;
    user-select:none;
}

.b1{top:100px;right:80px;transform:rotate(15deg);}
.b2{bottom:150px;left:60px;transform:rotate(-15deg);}
.b3{top:900px;right:100px;transform:rotate(-8deg);}
.b4{bottom:350px;right:350px;transform:rotate(20deg);}

.controls{
    margin-top:20px;
}

button{
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#ffd700;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="calendar">

    <!-- Remplacer par votre fichier -->
    logo-heineken.png

    <div class="barley b1">🌾</div>
    <div class="barley b2">🌾</div>
    <div class="barley b3">🌾</div>
    <div class="barley b4">🌾</div>

    <div class="title">CALENDRIER 2026</div>
    <div class="subtitle">Semaines S1 à S53 (jusqu'au 03/01/2027)</div>

    <div class="grid" id="weeksGrid"></div>

</div>

<div class="controls">
    <button onclick="downloadPNG()">
        Télécharger PNG
    </button>
</div>

<script>

const grid = document.getElementById("weeksGrid");

function formatDate(date){
    return date.toLocaleDateString('fr-FR',{
        day:'2-digit',
        month:'2-digit'
    });
}

// Début S1 2026 : lundi 29/12/2025
let current = new Date('2025-12-29');

for(let week=1; week<=53; week++){

    let start = new Date(current);

    let end = new Date(current);
    end.setDate(end.getDate()+6);

    const div = document.createElement("div");
    div.className = "week";

    div.innerHTML = `
        <div class="week-title">S${week}</div>
        <div class="week-date">
            ${formatDate(start)} → ${formatDate(end)}
        </div>
    `;

    grid.appendChild(div);

    current.setDate(current.getDate()+7);
}

async function downloadPNG(){

    const canvas = await html2canvas(
        document.getElementById("calendar"),
        {
            scale:1,
            useCORS:true,
            backgroundColor:null
        }
    );

    const link = document.createElement("a");
    link.download = "Calendrier_2026_Semaines.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
